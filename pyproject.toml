[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dogma-press"
version = "0.1.0"
description = "CSV-to-PDF print-and-play cards for Devil's Dogma TCG"
requires-python = ">=3.10"
dependencies = ["reportlab>=4.2,<5"]

[project.scripts]
dogmapress = "dogmapress.cli:main"

[tool.setuptools.packages.find]
include = ["dogmapress*"]
